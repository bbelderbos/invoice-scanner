[project]
name = "invoice-scanner"
version = "0.1.0"
description = "Extract structured expense data from invoice/receipt PDFs via a pluggable LLM backend (claude -p or a local Ollama model)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bob Belderbos", email = "bobbelderbos@gmail.com" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
ollama = ["pymupdf>=1.24"]
dev = ["pytest>=8", "ruff", "pymupdf>=1.24"]

[project.scripts]
invoice-scan = "invoice_scanner.cli:main"

[project.entry-points."invoice_scanner.backends"]
claude = "invoice_scanner.backends.claude:make"
ollama = "invoice_scanner.backends.ollama:make"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_scanner"]

[tool.ruff]
target-version = "py312"
line-length = 100
